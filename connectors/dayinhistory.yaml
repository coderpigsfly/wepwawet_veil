# connectors/dayinhistory.yaml - the voice map for Day in History (an app we didn't write; the build reads it).
# Made on the Integrations page (Oct 19, 2026). Fill it in, then Tools, Maintenance, build.
# For each voice action:
#   api:        the app's command (method and path, as listed in its spec: the Commands tab)
#   learn_from: dataset intents whose sentences teach how people say this action
#   words:      your own words, for actions the datasets don't cover (kept short)
#   objects:    nouns that decide the action outright
#   needs:      spoken needs: details the action uses (required: she asks; default: used and said; optional)
# Only actions listed here can be spoken. The app's own quirks live in connectors/dayinhistory.py
# (its helper, written for this app's API), its lines in phrases/dayinhistory.yaml.

service: dayinhistory
topic: history
default_action: today_events   # Oct 19: a history question no rule fits reads today's events (the plain list had no lines: "Mm.")

# the defaults are settings: services: dayinhistory: options: in settings.yaml
defaults: {}
match_min: 0.6 # share of an item's words that must be said to count as that item (the Voice map tab)

actions:
  list:
    api: GET /v1/today/events/
    learn_from: {}
    words: []
    objects: []
    needs: {}

# the words its helper uses to clean up what was said (each list shows on the Integrations card)
language: {}
rules:
  today_events:
    words: [what happened in history, what happened today, what happened on this day, this day in history, on this day in history]
    steps:
      - call: GET /v1/today/events/
      - response: {lines: ["On this day in history: {items}."], empty_lines: ["Nothing in history today, it seems."], list: true, line: "{year}: {title}"}
  born_today:
    words: [who was born today, who was born on this day, born today]
    steps:
      - call: GET /v1/today/births/
      - response: {lines: ["Born on this day: {items}."], empty_lines: [Nobody I know of was born today.], list: true}
  died_today:
    words: [who died today, who died on this day, died today]
    steps:
      - call: GET /v1/today/deaths/
      - response: {lines: ["Died on this day: {items}."], empty_lines: [Nobody I know of died on this day.], list: true}
  events_on:
    words: [what happened on, what happened in history on]
    steps:
      - call: "GET /v1/events/{month}/{day}/"
      - response: {lines: ["On {day_said} in history: {items}."], empty_lines: ["Nothing I know of happened on {day_said}."], list: true, line: "{year}: {title}"}
  fun_fact:
    words: [tell me something, a fun fact, fun fact]
    steps:
      - call: GET /v1/today/events/
      - response: {lines: ["In {year}: {title}. {description}"], empty_lines: ["Nothing in history today, it seems."], one: random}


