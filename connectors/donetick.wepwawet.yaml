# The compliant copy of donetick (issue #24), written by tools/wepwawet_copy.py: the app's own
# file is never changed. Its user rules of a standard shape are actions here; one the household
# keeps by hand under the same name (connectors/<app>.yaml rules:) is used instead.
x-wepwawet:
  version: 2
  title: donetick
  source:
    written_by: Wepwawet Veil
    from: donetick 1.0
    pushed_back:
    - find
    - rename
    - rename_project
  data:
    kind: transient
    pace: fast
    hold_seconds: 60.0
  lists:
    people:
      from: GET /circles/members
      id: userId
      name: displayName
      house: people
    project:
      from: GET /projects
      id: id
      name: name
  actions:
    rename:
      starts:
      - rename
      - change the name of
      - renamed
      target:
        from: GET /chores
        find:
          until:
          - to
          - as
          last: true
          on_last:
          - call it
          - name it
          - it should be called
          - it should be
          - the name should be
          - change the name to
          - change its name to
          act: 85
          ask: 45
      confirm: {}
      value:
        need: new_name
        after:
        - to
        - as
        question: What should I call it?
      send:
        whole: GET /chores/{id}
        set:
          name: new_name
        fill_empty:
          assignStrategy: keep_last_assigned
      command: PUT /chores
      says:
        lines:
        - '{item} is now {new_name}.'
    rename_project:
      starts:
      - rename
      - change the name of
      objects:
      - project
      - projects
      target:
        from: GET /projects
        find:
          until:
          - to
          - as
          ignore:
          - project
          - projects
          act: 85
          ask: 45
      confirm: {}
      value:
        need: new_name
        after:
        - to
        - as
        question: What should I call the project?
      send:
        whole: GET /projects
        set:
          name: new_name
      command: PUT /projects/{id}
      says:
        lines:
        - The project {item} is now {new_name}.
    find:
      starts:
      - find
      - look up
      - look for
      - where's
      - where is
      - when's
      - when is
      - what time
      - what day
      - what is the due date
      - what's the due date
      target:
        from: GET /chores
        find:
          ignore:
          - due
          - date
          - 'on'
          - of
          - for
          - about
          - chore
          - chores
          - task
          - tasks
          - can
          - could
          - you
          - me
          - please
          - tell
          last: true
          act: 60
          ask: 20
          extra_words: ignore
      confirm: {}
      says:
        lines:
        - '{item} is due {due}.'
        - '{item}, due {due}.'
        fields:
          due: nextDueDate
        empty_lines:
        - '{item} has no due date.'
        past_lines:
        - '{item} was due {due}.'
        - '{item} is overdue: it was due {due}.'
