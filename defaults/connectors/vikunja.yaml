# connectors/vikunja.yaml - the voice map for Vikunja (hand-written; the build reads it).
# Donetick's voice map with Vikunja's commands (issue #16): the words, needs and follow-ups are the same.
# For each voice action:
#   api:        the Vikunja command (method and path, as listed in its spec)
#   learn_from: dataset intents whose sentences teach how people say this action
#   words:      your own words, for actions the datasets don't cover (kept short)
#   needs:      spoken needs: the details the action uses (edited on Integrations, Voice map)
#                 required -> missing means she asks (path C): the router asks for the ones it
#                             hears itself (settings router: heard_needs: who, when), the helper the rest
#                 default  -> missing means the default below is used, and said aloud
#                 optional -> used if given
# Only actions listed here can be spoken. Delete, archive, timers, history: never by voice.

service: vikunja
topic: chores
default_action: list     # no verb heard ("my chores") -> list
match_min: 0.6           # share of a chore name's words that must be said to count as that chore (the Voice map tab)

# The defaults are settings, on Vikunja's Defaults tab: its lists (people and project, each with its
# default; who "me" is on the people card) and options (default_chore_time); the timezone is the
# house's (Settings, The house).
defaults: {}

actions:

  list:                  # what's due / read everything / what does Beth have
    api: GET /tasks
    learn_from:
      massive: [lists_query, calendar_query]
      clinc150: [todo_list, reminder, calendar]
    words: [what, show, tell, read, any, check my list, check the list, check my chores, check the chores, check my tasks]
    objects: []   # these nouns decide the action outright
    needs: {who: optional, when: optional}

  projects:              # what projects do I have
    api: GET /projects
    learn_from: {}
    words: [what, show, projects, project]
    objects: [projects, project]   # these nouns decide the action outright
    needs: {}

  add:                   # add a task to have Beth do the trash tomorrow (stage 3)
    api: "PUT /projects/{id}/tasks"   # {id}: the project it goes in
    learn_from:
      massive: [lists_createoradd, calendar_set]
      clinc150: [todo_list_update, reminder_update, calendar_update]
    words: [add, put, create, set up, need, remind]
    objects: []   # these nouns decide the action outright
    needs: {name: required, when: optional, who: default, project: default, repeat: optional}   # when: the due date is offered after it's added
    # The follow-up series (series.py): which fields the app has, each with a generic type.
    #   kind: required (asked before creating) | default (used, said aloud) | extra (offered after)
    #   only_if: offered once that field is filled   direction: before | after (durations)
    #   offer: how she names it in "I can add ..."   readback: how it reads in the read-back
    #   default: used when the field is named with no value ("nag me")
    #   list: the app's list it's filled from (a card on the Defaults tab: its items and its default)
    fields:
      name: {type: text, kind: required}
      who: {type: person, kind: default, list: people}
      project: {type: choice, kind: default, words: [project], list: project}
      due_date: {type: date, kind: extra, words: [due date, date], offer: a due date}
      due_time: {type: time, kind: extra, words: [due time, time], offer: a due time, only_if: due_date}
      repeat: {type: recurrence, kind: extra, words: [repeat, repeats, repeating, recurring], offer: repeat, readback: "repeats {say}"}
      # "remind me" alone means at the due time (Oct 15): a reminder before needs its amount ("10 minutes before")
      remind_before: {type: duration, kind: extra, direction: before, only_if: due_date, words: [reminder before, reminder, alert, warn me, warning], offer: a reminder before, readback: "reminder {say}"}
      remind_at_due: {type: yesno, kind: extra, only_if: due_date, words: [at the due time, at due time, when it's due, when its due, on time, remind me, remind], offer: a reminder when it's due, readback: "reminder when it's due"}
      nag: {type: duration, kind: extra, direction: after, only_if: due_date, words: [nag, nags, nagging, nag me], default: "every 15 minutes", offer: nags, readback: "nags every {base}"}

  complete:              # mark the trash done / I finished the dishes
    api: "POST /tasks/{id}"     # done: true (a repeat moves on, still open)
    learn_from: {}
    words: [done, finished, completed, check off, mark]
    needs: {chore: required}
    objects: []

  skip:                  # skip watering the plants / cancel feeding the chickens
    api: "POST /tasks/{id}"     # Vikunja has no skip: done, so a repeat moves on
    learn_from: {}
    words: [skip, cancel]
    objects: []   # these nouns decide the action outright
    needs: {chore: required}

  move:                  # move the gutters to Saturday
    api: "POST /tasks/{id}"     # the new due_date
    learn_from: {}
    words: [move, push, reschedule, postpone, change]
    objects: []   # these nouns decide the action outright
    needs: {chore: required, when: required}

  nudge:                 # remind Beth about the trash (the chore already exists)
    api: "POST /tasks/{id}"     # Vikunja has no nudge: a reminder a minute from now
    learn_from: {}
    words: [nudge, poke, remind]
    objects: []   # these nouns decide the action outright
    needs: {chore: required, who: optional}

  undo:                  # undo that / take that back
    api: "POST /tasks/{id}"     # Vikunja has no undo: done back off, or a repeat back one
    learn_from: {}
    words: [undo, take back]
    objects: []   # these nouns decide the action outright
    needs: {chore: required}   # the last chore she touched, if none is named
    # the changes the undo reverses (connectors/vikunja.py undo_body); any other she says she can't undo (undo_names)
    reverses: [complete, skip]

  create_project:
    api: PUT /projects
    learn_from: {}
    words: [create, make, new project]
    objects: []
    needs: {title: required}     # its spec names no body field: the needs it accepts are sent

# User rules (Integrations, Vikunja, User rules): the app's commands chained with the router's own
# steps (veil/rules.py). Rename: find the chore by what was said before "to" (a misheard name too),
# check first when the match isn't sure, read it fresh and send it back whole with the new name
# (Vikunja's edit replaces the whole task).
rules:
  rename:
    words: [rename, change the name of, renamed]
    steps:
      - call: GET /tasks
      - search: {field: title, until: [to, as], last: true, on_last: [call it, name it, it should be called, it should be, the name should be, change the name to, change its name to]}
      - match: {act: 85, ask: 45}
      - confirm: {}
      - ask: {need: new_name, after: [to, as], question: "What should I call it?"}
      # the new name said back first: a cut-off answer ("Me") isn't saved unheard (Oct 21)
      - confirm: {always: true, question: "Rename {item} to {new_name}?"}
      - fresh_copy: {read: "GET /tasks/{id}", set: {title: new_name}}
      - call: "POST /tasks/{id}"
      - say: {line: "{item} is now {new_name}."}
  # a project named too ("rename the house project to home"): this one, not the chore's rename
  rename_project:
    words: [rename, change the name of]
    objects: [project, projects]
    steps:
      - call: GET /projects
      - search: {field: title, until: [to, as], ignore: [project, projects]}
      - match: {act: 85, ask: 45}
      - confirm: {}
      - ask: {need: new_name, after: [to, as], question: "What should I call the project?"}
      - fresh_copy: {read: "GET /projects/{id}", set: {title: new_name}}
      - call: "POST /projects/{id}"
      - say: {line: "The project {item} is now {new_name}."}
  # delete: Vikunja's own delete (DELETE /tasks/{id}), always asked first, even on a sure match
  delete:
    words: [delete]
    steps:
      - call: GET /tasks
      - search: {field: title, last: true}
      - match: {act: 85, ask: 45}
      - confirm: {always: true, question: "It can't be undone. Delete {item}?"}
      - call: "DELETE /tasks/{id}"
      - say: {line: "{item} is deleted."}
  find:
    words:
      - find
      - look up
      - look for
      - where's
      - where is
      - when's
      - when is
      - what time
      - what day
      - what is the due date
      - what's the due date
      - do i have a chore
      - do i have a task
      - is there a chore
      - is there a task
      - do i have a           # "Do I have a picnic in my chores?": yes and its day, or no (Oct 21)
      - do i have an
      - is there a
      - is there an
    steps:
      - call: GET /tasks
      - search:
          field: title
          ignore:
            - due
            - date
            - "on"
            - of
            - for
            - about
            - chore
            - chores
            - task
            - tasks
            - can
            - could
            - you
            - me
            - please
            - tell
            - do
            - have
            - there
            - any
            - called
            - named
          last: true
      - match:
          act: 60
          ask: 20
          extra_words: ignore
          not_found: "No, there's no {searched} in your chores."
      - confirm: {}
      - response:
          lines:
            - "{item} is due {due}."
            - "{item}, due {due}."
          fields:
            due: due_date
          empty_lines:
            - "{item} has no due date."
          past_lines:
            - "{item} was due {due}."
            - "{item} is overdue: it was due {due}."
language:
  # words that never count toward matching a chore's name (the weekdays from vocab/language.yaml too)
  never_in_names: [a, about, an, and, at, back, change, chore, chores, complete, completed, done, finish, finished, for, i, "i'm", im, in, is, it, list, mark, me, move, my, nudge, of, "on", out, please, poke, postpone, push, remind, reschedule, skip, take, task, tasks, that, the, this, to, today, tomorrow, tonight, undo, up, was]
  # words that aren't part of a project's name ("the house project")
  project_plain: [a, and, list, lists, my, of, project, projects, the]
  # words that mean the person speaking (options: me: in settings.yaml decides who that is)
  me_words: [me, myself, my, i, mine]
  # how she names a change Vikunja can't undo ("Vikunja doesn't let me undo an add")
  undo_names: {add: an add, skip: a skip, move: a move, nudge: a nudge, complete: a completion}
  strip_away:
    - chore
    - chores
    - task
    - tasks
    - todo
    - to-do
    - list
    - list's
    - project
    - projects
    - reminder
sound_alike: true


never_by_voice:
  - archive
  - erase


ask_min: 0.4


