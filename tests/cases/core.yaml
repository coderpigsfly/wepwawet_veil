  turns: [{heard: "Tell me a joke", path: gemini, engine: gemini, answer: "Why did the scarecrow win an award?", time: 9999999999}]
  say: "What did you just hear?"
  expect: {path: learn, kind: heard, speech_has: "Tell me a joke"}
