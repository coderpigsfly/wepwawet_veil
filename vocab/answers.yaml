# vocab/answers.yaml - short answers to the persona's own questions (path C).
# A request counts as an answer only if it is short (answer_max_words in settings.yaml)
# and is, or starts with, one of these. Anything else drops the question and is
# handled as a new request. The keys are quoted: bare yes/no mean true/false in YAML.
# After editing: docker compose restart

# a yes said more loosely, to her offer ("Saturday's fine", "that works"): it confirms what she offered
affirm_words: [fine, great, good, perfect, works, sounds, okay, ok, sure, "yes", yeah, yep, would, does, right, correct, wonderful]

# asking for the rest she offered to read ("What are my other chores?" to "Shall I read the rest?")
rest_words: [other, others, rest, remaining, more]

"yes":
  - "yes"
  - "yeah"
  - "yep"
  - "yup"
  - "sure"
  - "okay"
  - "ok"
  - "please"
  - "go ahead"
  - "go on"
  - "keep going"
  - "continue"
  - "carry on"
  - "keep reading"
  - "read on"
  - "read them"
  - "read it"
  - "read the rest"
  - "the rest"
  - "all of them"
  - "more"
  - "absolutely"
  - "of course"

# a thanks said to her confirmation ("...Right?", "Is that right?", "Did you mean ...? Shall I?") is a yes (Oct 22:
# "Thank you." to "I'll remember: Mara's shoe size is eight and a half. Right?" lost the flea); never to her other
# questions ("Want me to ask around?"), where thanks could be either
confirm_thanks:
  - "thank you"
  - "thanks"
  - "thank you very much"
  - "thank you so much"
  - "thanks a lot"
  - "thanks so much"

"no":
  - "no"
  - "nope"
  - "nah"
  - "no thanks"
  - "no thank you"
  - "that's enough"
  - "that's fine"
  - "i'm good"
  - "im good"
  - "stop"
  - "skip it"


# Answers that end the follow-up series ("anything else?") for any app.
# Plain "no" is already a stop; these are the other ways people say it.
"stop":
  - "no"
  - "no thanks"
  - "no thank you"
  - "nope"
  - "nah"
  - "that's all"
  - "that's it"
  - "nothing else"
  - "nothing"
  - "forget that"
  - "forget it"
  - "you misheard"
  - "you heard wrong"
  - "i'm done"
  - "im done"
  - "we're done"
  - "all set"
  - "i'm good"
  - "that's fine"

# A longer yes or no to "Want me to ask around?" counts when it talks about the asking
# ("Yes, check with your coven", "No, don't ask around"). Include the words each assistant
# uses for asking in phrases/router.yaml ask_around (Iris: coven, spell book, cauldron).
about_asking: [ask, asking, check, checking, consult, look, coven, spell book, spellbook,
               cauldron, crystal ball]


